# The Chrome DevTools Protocol surface crawlx uses.
#
# Every CDP method the adapter sends and every event it consumes is listed here.
# `ci/lint-static.sh` checks that adapter method/event names match this catalog.
# `crates/crawlx-browser/tests/cdp_surface.rs`, with Chromium configured, sends each
# non-skipped command with a minimal payload and rejects `MethodNotFound`.
# The `chromium-next` job runs the live check against Stable before a pin bump.
#
# `requires` tells the live test what a command needs: `browser` (the browser endpoint),
# `page` (an attached page session) or `skip` (destructive, needs fixtures, or changes the
# session in a way later probes cannot undo). Skip entries are not live-probed here;
# dedicated runtime fixtures provide any command-specific execution evidence.

[chromium]
version = "155.0.8059.84"
cdp_revision = "1.3"

[[commands]]
name = "Accessibility.enable"
requires = "page"

[[commands]]
name = "Accessibility.getFullAXTree"
requires = "page"

[[commands]]
name = "Accessibility.getPartialAXTree"
requires = "page"
params = { fetchRelatives = false, backendNodeId = 1 }

[[commands]]
name = "Browser.close"
requires = "skip"

[[commands]]
name = "Browser.getVersion"
requires = "browser"

[[commands]]
