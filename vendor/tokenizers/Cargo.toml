# Vendored tokenizers 0.23.2 with one dependency change: `paste` (RUSTSEC-2024-0436, archived and reported
# unmaintained) is replaced by its drop-in fork `pastey` in the two `paste::paste!` macros of
# `src/utils/mod.rs`. The upstream manifest is `Cargo.toml.upstream`; benches, tests and dev-dependencies are
# not vendored (the crate is not a workspace member). Remove this directory and the `[patch.crates-io]` entry
# once a release that no longer uses `paste` and builds on this toolchain exists.

[package]
authors = [
  "Anthony MOI <m.anthony.moi@gmail.com>",
  "Nicolas Patry <patry.nicolas@protonmail.com>",
]
edition = "2018"
name = "tokenizers"
version = "0.23.2"
homepage = "https://github.com/huggingface/tokenizers"
repository = "https://github.com/huggingface/tokenizers"
documentation = "https://docs.rs/tokenizers/"
license = "Apache-2.0"
keywords = ["tokenizer", "NLP", "huggingface", "BPE", "WordPiece"]
description = """
Provides an implementation of today's most used tokenizers,
with a focus on performances and versatility.
"""
exclude = [
  "rust-toolchain",
  "target/*",
  "Cargo.lock",
  "benches/*.txt",
  "benches/*.json",
  "data/*",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "tokenizers"
path = "src/lib.rs"
bench = false

[dependencies]
rand = "0.9"
onig = { version = "6.5.1", default-features = false, optional = true }
regex = "1.10"
regex-syntax = "0.8"
rayon = "1.10"
rayon-cond = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization-alignments = "0.1"
unicode_categories = "0.1"
unicode-segmentation = "1.11"
indicatif = { version = "0.18", optional = true }
itertools = "0.14"
log = "0.4"
derive_builder = "0.20"
spm_precompiled = "0.1.3"
hf-hub = { version = "0.4.1", features = [
  "ureq",
], default-features = false, optional = true }
daachorse = "3.0.0"
pastey = "0.2"
macro_rules_attribute = "0.2.0"
thiserror = "2"
fancy-regex = { version = "0.17", optional = true }
getrandom = { version = "0.3" }
esaxx-rs = { version = "0.1.10", default-features = false, features = [] }
monostate = "0.1.12"
ahash = { version = "0.8.11", features = ["serde"] }
dary_heap = { version = "0.3.6", features = ["serde"] }
compact_str = { version = "0.9", features = ["serde"] }

[features]
default = ["progressbar", "onig", "esaxx_fast"]
esaxx_fast = ["esaxx-rs/cpp"]
progressbar = ["indicatif"]
http = ["hf-hub"]
unstable_wasm = ["fancy-regex", "getrandom/wasm_js"]
rustls-tls = ["hf-hub?/rustls-tls"]
parity-aware-bpe = []

