[workspace]
resolver = "2"
members = ["crates/*"]
# `fuzz/` is its own cargo-fuzz workspace; it must not inherit the lints or profiles.
exclude = ["fuzz", "vendor/pdf-loader/lopdf-0.46.0", "vendor/hickory-resolver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.97"
repository = "https://github.com/noxred-research/crawlx"
publish = false

[workspace.dependencies]
# runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
# serialization / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
toml = "1.1"
# YAML custom-field config files (`crawlx crawl --custom-field-config`; compatibility-flag `-flc` shape)
serde_yaml_ng = "0.10"
bytes = "1"
# hashing / ids / rng
blake3 = "1"
uuid = { version = "1", features = ["v7", "serde"] }
rand = "0.10"
rand_chacha = "0.10"
# errors / logging
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
# web / http
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream", "socks"] }
# Synthetic seeded ClientHello profiles only; default fetch transport stays rustls.
# 0.16 requires Rust 1.98. 0.15.3 is Apache-2.0, MSRV 1.85, uses BoringSSL (not openssl-sys).
wreq = { version = "=0.15.3", default-features = false, features = ["webpki-roots", "gzip", "brotli"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "client-legacy"] }
http = "1"
http-body-util = "0.1"
http-body = "1"
axum = { version = "0.8", features = ["json", "macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
hmac = "0.13"
sha2 = "0.11"
sha1 = "0.11"
base32 = "0.5"
hex = "0.4"
base64 = "0.23"
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
# parsing
regex = "1"
# JSON Schema validation of `/extract` and `/agent` results (no http/file `$ref` retrieval)
jsonschema = { version = "0.60", default-features = false }
# OpenAPI per-operation schemas of the facade (`crawlx-api::openapi_schemas`): `#[derive(JsonSchema)]` request/response types; MIT
schemars = "1"
# HIR walk of the HTML `pattern` attribute so a conforming form value can be generated (`crawlx-extract::form_fill`)
regex-syntax = "0.8"
quick-xml = "0.42"
# document parsers for `crawlx-extract::parse` (the `/parse` upload endpoint); all MIT-licensed.
# `zip`: OOXML/ODF/EPUB containers; `calamine`: xlsx/xls/xlsb cells; `lopdf`: PDF text layer
# (no rayon/chrono default features); `cfb`: OLE2 containers of legacy `.doc`/`.ppt`.
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
calamine = { version = "0.38", default-features = false }
lopdf = { version = "0.46", default-features = false }
cfb = "0.16"
encoding_rs = "0.8"
scraper = "0.29"
html5ever = "0.40"
ego-tree = "0.11"
# OCR (`crawlx-extract::parse::ocr`): `image` decodes/rotates/encodes scans (PNG, JPEG, GIF, BMP, TIFF incl. CCITT,
# WebP; no rayon); `ocrs` + `rten` are the optional pure-Rust backend (`ocrs` feature of crawlx-extract; models are
# loaded from `CRAWLX_OCR_MODELS`, nothing is downloaded at build or run time). All MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = "0.26"
# line diff of `markdown_diff` (`crawlx-extract::diff`, upstream change-tracking git-diff output)
similar = { version = "3", default-features = false }
# JavaScript AST endpoint pass (crawlx-extract `js-ast` feature); `regular_expression`
# off: regex literals are never inspected, only parsed as opaque tokens
oxc_parser = { version = "0.156", default-features = false }
oxc_ast = "0.156"
oxc_ast_visit = "0.156"
oxc_allocator = "0.156"
oxc_span = "0.156"
# db / storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
# monitor schedules (crawlx-scheduler `Schedule`): IANA zones and DST-aware five-field cron evaluation
chrono-tz = "0.10"
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
croner = "4"
# S3-compatible object store; TLS through rustls+ring like the rest of the workspace, not aws-lc
aws-config = { version = "1.13", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1.145", default-features = false, features = ["rt-tokio", "http-1x", "behavior-version-latest"] }
aws-sdk-secretsmanager = { version = "1.115", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-kms = { version = "1.129", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "1.4", features = ["rustls-ring"] }
# browser
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
# misc
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
once_cell = "1"
# Runtime pressure tracing observed THP promotion adding 6648KiB RSS while
# allocator used-block accounting fell 84384 bytes. Avoid MADV_HUGEPAGE advice
# in production and in runtime-pressure proofs alike.
mimalloc = { version = "0.1.52", features = ["no_thp"] }
# CPU profiling for `crawlx serve|worker --pprof-bind`: `protobuf-codec` is the pure-Rust encoder of the
# pprof `profile.proto` (no `protoc`), `cpp` (C++ symbol demangling) is off.
pprof = { version = "0.15", default-features = false, features = ["protobuf-codec"] }
parking_lot = "0.13"
# Shared volatile ZDR delivery; server persistence is refused by the adapter.
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "script"] }
indexmap = { version = "2", features = ["serde"] }
ipnet = { version = "2", features = ["serde"] }
# public suffix list for `scope.hostScope: rdn`; bundled list, no network
publicsuffix = "2.3"
hickory-resolver = "0.26.1"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
strsim = "0.11"
unicode-normalization = "0.1"
# telemetry export (crawlx-telemetry `otlp` feature only)
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.34"
# OTLP wire decoding in tests (crawlx-bench `tests/observability.rs` stub collector)
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "metrics"] }
prost = "0.14"
# ONNX inference (crawlx-model `onnx` feature only): `load-dynamic` binds the
# ONNX Runtime shared library named by `ORT_DYLIB_PATH` at run time; nothing is downloaded at build time.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
# dev
proptest = "1"
wiremock = "0.6"
tempfile = "3"
tokio-test = "0.4"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7"
# peak-heap counting allocator for the parser memory ceiling test (crawlx-extract `tests/parse_memory_ceiling.rs`, MIT)
peak_alloc = "0.3"
# compile-fail tests (crawlx-safety `tests/ui.rs`)
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
# `clippy.toml` disallows `HashMap`/`HashSet`; only the deterministic decision crates
# (crawlx-state, crawlx-graph, crawlx-strategies) deny it at the crate root.
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
# Dependencies build at opt-level 1 in dev profiles to keep rebuilds short;
# release builds are unaffected.
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# panic = "unwind" (default) is deliberate: the worker Supervisor converts task
# panics into typed SessionFailure events.

[profile.bench]
inherits = "release"
debug = true
strip = false

[patch.crates-io]
# Bound eager object/xref expansion before untrusted PDF data reaches native parsers.
lopdf = { path = "vendor/pdf-loader/lopdf-0.46.0" }
# Keep baseline DNS failover and configured TCP retry on the security-patched release.
hickory-resolver = { path = "vendor/hickory-resolver" }
