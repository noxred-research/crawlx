# Divergence ledger of the upstream differential harness.
#
# Every documented difference between upstream (pinned commit
# c31e88c07afe941bfd8aebde61684eeba042abb5) and crawlx. The runner
# (`crawlx-differential`, crates/crawlx-bench/src/differential) consults this file for each
# difference it finds; an admission difference without an entry fails the run, a content,
# metadata or counter difference without an entry is a warning. A divergence caused by a crawlx
# defect is fixed, never recorded here.
#
# Entry fields:
#   id            stable id, FAMILY-NNN (families: see `families.json`)
#   family        test family
#   families      optional: ids of families.json the entry applies to (the runner label); absent = every
#                 family. Family-specific entries must not tolerate the same difference elsewhere.
#   level         C1 admission, C2 content, C3 lifecycle
#   kind          admission | robots | markdown | links | metadata | counter
#   side          admission/robots only: upstream_only | crawlx_only
#   match         glob over the normalized URL key (`{origin}/path?query`; `*` is the only
#                 wildcard); for `counter`, the field name (status, total, completed,
#                 markdown_corpus_mean, metadata_rate). Absent = matches all.
#   field         metadata only: title | description | language | statusCode | contentType
#   class         intentional_security | intentional_correctness | upstream_bug | unsupported_feature
#   source        provenance (R3): documentation URL, black-box run id, SDK type, RFC section
#   rationale     why
#   user_visible  what a migrating user sees; required for intentional classes

version = 1

[[divergence]]
id = "QRY-001"
family = "QRY"
level = "C1"
kind = "admission"
side = "upstream_only"
match = "*?utm_*"
class = "intentional_correctness"
source = "Upstream `ignoreQueryParameters` request option; crawlx query-parameter classification (crates/crawlx-policy)"
rationale = "With its default query handling (`ignoreQueryParameters: false`) upstream fetches every distinct query string as a distinct page. crawlx in `native_defaults`/`classify` mode drops TRACKING and SESSION parameters, so `?utm_*` variants collapse onto the canonical page. The compat facade's `strict` mode uses `keep_all` and has no such difference; this entry applies only when the crawlx side ran with `classify` (`crawlx-differential --query-policy classify`)."
user_visible = "Tracking-parameter variants of a page count as one page once a tenant moves to native defaults."

[[divergence]]
id = "CNT-001"
family = "CNT"
families = ["s1", "s1-depth", "s1-exclude", "s1-sitemap-skip"]
level = "C3"
kind = "counter"
match = "completed"
class = "unsupported_feature"
source = "black-box run 2026-10-28 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/s1.json (404 and 500 pages are data[] documents, errors[] empty)"
rationale = "Upstream returns a page that answered 4xx or 5xx as a data[] document (metadata.statusCode and metadata.error set, markdown of the error body) and counts it in total and completed; errors[] stays empty. crawlx's URL plane records such a fetch as failed (frontier row failed, reason http_NNN, GET /errors), stores no page and counts it in failed, not succeeded, so its completed is lower by the number of error pages. The authored sample of 2026-10-20 had assumed the opposite."
user_visible = "completed (and total in the facade) is lower by the number of pages that answered with an HTTP error status; those URLs are in /errors instead of data[]."

[[divergence]]
id = "CNT-002"
family = "CNT"
families = ["s1", "s1-depth", "s1-sitemap-skip", "s1-ignore-query", "s1-entire-domain"]
level = "C3"
kind = "counter"
match = "total"
class = "intentional_correctness"
source = "black-box run 2026-10-28 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; trailing slash; crates/crawlx-url/src/canonical.rs `TrailingSlash::Keep` (the facade workers' default); `deduplicateSimilarURLs: false` run of s1: 35 documents instead of 34"
rationale = "crawlx keeps `/a` and `/a/` as distinct resources by default (TrailingSlash::Keep) and fetches both when a site links both spellings; upstream's default deduplicateSimilarURLs=true fetches one of them. The in-process crawlx run uses the facade's canonicalization (`--trailing-slash keep`), the admission keys of this scorecard strip the slash, so only the cardinality differs."
user_visible = "total is higher by one per page a site links both with and without a trailing slash; both fetches hit the origin."

[[divergence]]
id = "JSE-001"
family = "SCOPE"
families = ["d1", "g12", "hybrid-mix", "s1-entire-domain"]
level = "C1"
kind = "admission"
side = "crawlx_only"
match = "*/api/:path"
class = "intentional_correctness"
source = "black-box run 2026-10-28 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; compat flag `-jc` endpoint mining"
rationale = "crawlx mines endpoint URLs from page scripts (scope.jsEndpoints, default on, compat flag `-jc` parity); the gym client library inlined in every fixture page contains `fetch('/' + FIXTURE + '/api/' + path)`, which yields the placeholder URL `/<fixture>/api/:path`. upstream's link extraction reads anchors only and does not look into scripts."
user_visible = "crawlx also requests URLs named in a page's script text; upstream never does. Set scope.jsEndpoints=false natively to turn it off (the compat facade has no field for it)."

