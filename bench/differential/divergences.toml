# ---- families of fixture `d2` (2026-10-29 run; upstream c31e88c07afe941bfd8aebde61684eeba042abb5) ----
# SCOPE / EXT / REDIR / ROBOTS. Each entry names the families it was measured in; the requested
# set (fixture access log) of a URL is documented by the admission entry of the same URL and side.

[[divergence]]
id = "SUB-001"
family = "SCOPE"
families = ["d2-scope", "d2-external"]
level = "C1"
kind = "admission"
side = "upstream_only"
match = "http://www.gym.test:{port}/d2/scope/*"
class = "unsupported_feature"
source = "black-box run 2026-10-29 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/d2-scope.json (links to `www.gym.test` from the seed host `gym.test` are followed without allowSubdomains); crates/crawlx-core/src/config.rs `HostScope::Fqdn`"
rationale = "Upstream treats `www.<domain>` as the seed's own site: with default options (no allowSubdomains) it crawled /d2/scope/www and /d2/scope/www2 on `www.gym.test`, while it did not follow `app.gym.test`, `deep.app.gym.test` or `notgym.test`. crawlx's default host scope is the exact seed host (`fqdn`), so `www.gym.test` is a different host that only allowSubdomains admits (d2-subdomains: both systems fetch it)."
user_visible = "Links between `example.com` and `www.example.com` are not followed with default options; set allowSubdomains (or scope.hostScope rdn natively) to crawl both."

[[divergence]]
id = "EXT-001"
family = "EXT"
families = ["d2-external", "d2-sub-ext"]
level = "C1"
kind = "admission"
side = "upstream_only"
match = "http://*:{port}/d2/scope/*2"
class = "intentional_security"
source = "black-box run 2026-10-29 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/d2-external.json, d2-sub-ext.json; `allowExternalLinks` follows one hop; crates/crawlx-policy/src/scope.rs (`leaf_only`)"
rationale = "With allowExternalLinks upstream follows the links found on external pages as well: sub2, deep2, www2 and ext2 (linked only from pages on other hosts) were fetched, i.e. the crawl continues across hosts until `limit`. crawlx fetches an external page once and treats it as a leaf: its links are not followed, so a crawl cannot walk across third-party sites. d2-sub-ext: crawlx follows subdomain pages (in scope) transitively and differs only on the page behind the external host (`ext2`)."
user_visible = "allowExternalLinks fetches the external pages a crawled page links to, one hop; the pages those pages link to are not crawled."

[[divergence]]
id = "LNK-003"
family = "LINK"
families = ["d2-scope", "d2-subdomains", "d2-external", "d2-sub-ext"]
level = "C2"
kind = "links"
match = "{origin}/d2/scope"
class = "intentional_correctness"
source = "black-box run 2026-10-29 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/d2-scope.json (`<a href=\"#frag\">` on /d2/scope/)"
rationale = "Upstream lists a same-page fragment anchor in links[] as the page's own URL (`/d2/scope/#frag`); crawlx's links[] omits anchors that point into the same document, they are not links to another resource."
user_visible = "links[] has no entry for `#fragment` anchors of the page itself."

