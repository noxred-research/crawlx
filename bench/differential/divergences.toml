# kind `behavior`: `match` is `<scenario>/<observation>`, `|` separates alternatives, `*` globs. A
# `scenario/*` entry documents every observation of the scenario (decision, codes, settle step).

[[divergence]]
id = "VAL-001"
family = "VAL"
