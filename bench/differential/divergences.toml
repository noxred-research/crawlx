rationale = "Upstream accepts out-of-range, negative and fractional `limit` / `maxDiscoveryDepth` and coerces them silently (a limit of 0 or less crawls the seed only; a huge limit or depth is unbounded). The crawlx facade validates the range (`limit` 1..=4294967295, `maxDiscoveryDepth` 0..=65535, integers only) and answers 400 with the offending path; values inside the range above the plan maximum are clamped with a `limit_clamped` warning (see wire-clamp `limit-huge`)."
user_visible = "A negative, zero or fractional `limit`/`maxDiscoveryDepth`, or one beyond the 32-bit (16-bit) range, is a 400 instead of a silent coercion."

