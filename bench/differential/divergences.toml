source = "black-box run 2026-10-29 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/d2-redir.json (data[] holds /d2/redir/target once; the access log shows go/301, go/302chain, go/303, go/307, go/308 and go/rel were requested by both systems)"
rationale = "Both systems follow the redirects, but upstream reports a redirected page under its final URL only and, when that URL was already crawled, not at all (no data[] and no errors[] entry for the redirecting URL); crawlx records each redirecting URL it fetched as a frontier row of its own (deduplicated by content when the target is crawled too). The requested sets (fixture access log) are equal for these URLs."
user_visible = "total counts every URL fetched, including the URLs that redirect to a page that is also crawled; the redirecting URL has its own entry."

