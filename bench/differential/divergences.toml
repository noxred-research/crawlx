level = "C0"
kind = "behavior"
match = "unknown-key/*|allow-backward-links-v1/*|max-depth-v1/*|ignore-sitemap-v1/*|crawler-options-v1-shape/*|canonical-over-alias/*"
class = "intentional_correctness"
source = "black-box run 2026-10-29 against upstream c31e88c07afe941bfd8aebde61684eeba042abb5; bench/differential/captures/wire-val.json (`400 unrecognized_keys`: bogusKey, allowBackwardLinks, maxDepth, ignoreSitemap, crawlerOptions); v1 request aliases, crates/crawlx-api/src/routes/compat_crawl.rs `resolve_aliases`"
rationale = "Upstream v2 rejects every key it does not know, including the v1 spellings. The crawlx facade keeps v1 clients working: v1 aliases are read with a deprecation warning, any other unknown key is ignored with an `unsupported_option` warning in the 200 body."
user_visible = "A request with a v1 option or a misspelled key is accepted (with a warning in `warnings[]`) instead of rejected with 400."

