# Upstream self-host for the differential harness (the upstream checkout stays unmodified).
#
# The upstream Compose definition of the pinned commit is used unmodified: run.sh passes it as
# the FIRST `-f` file (commit c31e88c07afe941bfd8aebde61684eeba042abb5, a git-ignored or
# out-of-tree checkout, never committed; the repository is AGPL-3.0) and this file as the
# second, so Compose merges it over the upstream services:
#
#   docker compose -p crawlx-differential --env-file bench/differential/upstream.env \
#     -f $UPSTREAM_SRC/docker-compose.yaml -f bench/differential/docker-compose.upstream.yaml ...
#
# Nothing below changes upstream's images, commands, volumes or code. The additions are
#   * `ALLOW_LOCAL_WEBHOOKS=true` on the API container: the pinned build's `safeFetch` refuses
#     targets that resolve to private addresses unless this key (the same key the headless-browser
#     service reads, which the upstream Compose already passes to that service) is true, and the
#     gym fixture server runs on the host, reached over the docker bridge; and
#   * host aliases `gym.test` and the other names of the `d2` fixture (subdomains, a look-alike
#     domain, an external domain, the robots.txt variants; `fixture_hosts` of families.json) ->
#     host gateway on the containers that fetch pages, so that the gym started by run.sh on the
#     host is reachable from inside the stack under every name its pages link to.
# The stack is started per run, reached over HTTP on 127.0.0.1:${UPSTREAM_PORT:-3002} (host port
# set through `PORT`), and destroyed afterwards (`down -v`). It is never shipped or linked.

services:
  api:
    environment:
      ALLOW_LOCAL_WEBHOOKS: "true"
    extra_hosts:
      - "gym.test:host-gateway"
      - "app.gym.test:host-gateway"
      - "deep.app.gym.test:host-gateway"
      - "www.gym.test:host-gateway"
      - "notgym.test:host-gateway"
      - "other.test:host-gateway"
      - "big.gym.test:host-gateway"
      - "e404.gym.test:host-gateway"
      - "e403.gym.test:host-gateway"
      - "e503.gym.test:host-gateway"
      - "ua.gym.test:host-gateway"
  playwright-service: # wire-compat: service name in the upstream Compose file
    extra_hosts:
      - "gym.test:host-gateway"
      - "app.gym.test:host-gateway"
      - "deep.app.gym.test:host-gateway"
      - "www.gym.test:host-gateway"
      - "notgym.test:host-gateway"
      - "other.test:host-gateway"
      - "big.gym.test:host-gateway"
      - "e404.gym.test:host-gateway"
      - "e403.gym.test:host-gateway"
      - "e503.gym.test:host-gateway"
      - "ua.gym.test:host-gateway"
