name: release-checklist

# Release-gate checklist for `v*` tags. It lives outside ci.yml because a tag trigger makes
# every cached step of a workflow a cache-poisoning surface (a cache written by an earlier run
# must not influence a release decision), so this workflow restores and saves no caches.
#
# Tag runs have no producer jobs: no unit, browser, G1 or mutation artifacts exist in this run
# and prior-run artifacts are never substituted, so every measurement that only a producer can
# supply stays `unmeasured` and the checklist blocks until the release owner has supplied the
# evidence (see docs/ops/release-gates.md). ci.yml's `release-checklist` job keeps evaluating
# same-run producer evidence on manual dispatch and the weekly schedule.
#
# Every action is pinned to a full commit SHA; the comment names the tag it was resolved from.
#
# Workflow gate. Only code owners (the `*` rule of .github/CODEOWNERS on the default
# branch) can run this workflow: the first job, `authorize`, checks the actor and the
# triggering actor, and every other job needs it. The privileged fork-PR trigger and
# `workflow_run` are deliberately not used.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-checklist-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # No debug info: the checklist builds the workspace's bench crate and its dependencies only.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Workflow gate (see the header comment). Every other job depends on this one.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # CODEOWNERS comes from the default branch through the API, never from the checkout
          # of the event under test, so a change to the file cannot authorize itself.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # Users owning the `*` rule (the last `*` line wins, as in GitHub). Team owners
          # (@org/team) cannot be resolved with the workflow token and are ignored.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  release-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - name: Record that no producer ran in this tag run
        env:
          RELEASE_JOBS: "{}"
        run: |
          python3 -B ci/release-evidence.py --artifacts "$RUNNER_TEMP/release-inputs"
          cat bench/out/release-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Release-gate checklist
        run: ci/release-gate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-checklist
          path: |
            bench/out/release-checklist.json
            bench/out/release-checklist.md
            bench/out/release-evidence.json
            bench/out/release-evidence.md
