name: release

# Source-release workflow: runs on a `vX.Y.Z` tag push, or by hand (`workflow_dispatch`) for a tag
# that already exists, for example when the tag-push run failed for a reason outside the tagged
# tree (tags are protected and cannot be moved). It re-verifies the tagged tree, then builds a
# deterministic source archive plus SHA256SUMS and creates a *draft* GitHub release. A person
# publishes the draft after review. No binaries, container images or crates.io packages are
# built or pushed by this workflow. On a public repository the release files carry build
# provenance attestations and the source archive an SBOM attestation.
#
# Every action is pinned to a full commit SHA; the comment names the tag it was resolved from.
#
# Workflow gate. Only code owners (the `*` rule of .github/CODEOWNERS on the default
# branch) can run this workflow: the first job, `authorize`, checks the actor and the
# triggering actor, and every other job needs it. The privileged fork-PR trigger and
# `workflow_run` are deliberately not used.
#
# This gate is defense in depth. The authoritative controls are repository settings that the
# maintainers apply: a tag ruleset that restricts who can create `v*` tags, and a branch
# ruleset that requires code-owner review.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and draft (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The tag under release: the pushed tag, or the dispatch input (validated in `verify`).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # No debug info: full debug info for every test binary exhausts the hosted runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Workflow gate (see the header comment). Every other job depends on this one.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # CODEOWNERS comes from the default branch through the API, never from the checkout
          # of the event under test, so a change to the file cannot authorize itself.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # Users owning the `*` rule (the last `*` line wins, as in GitHub). Team owners
          # (@org/team) cannot be resolved with the workflow token and are ignored.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space, drop preinstalled browsers
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        # The runner's preinstalled Chrome cannot create its sandbox here (unprivileged user
        # namespaces are restricted), and tests that discover a system browser would start it;
        # the browser suites below run the pinned Chromium instead, as ci.yml does.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser
          df -h /
      - name: The release tag must be an existing vX.Y.Z tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=release tag::'$RELEASE_TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .ref >/dev/null
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Tag must match the workspace version and have a changelog section
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          if [ "$RELEASE_TAG" != "v${version}" ]; then
            echo "::error title=version mismatch::tag $RELEASE_TAG does not match workspace version v${version} in Cargo.toml"
            exit 1
          fi
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "::error title=changelog::CHANGELOG.md has no '## [${version}]' section"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: ci/lint-deps.sh
      - name: Workspace tests (PostgreSQL service; Chromium-gated tests skip here)
        # As in ci.yml: the bench crate's browser tests run in the pinned-Chromium step below.
        run: |
          cargo test --workspace --locked --exclude crawlx-bench
          cargo test -p crawlx-bench --locked -- --skip browser_
      # The Chromium-gated suites run against the pinned build exactly as ci.yml's `browser` job
      # does (the pin is sha256-verified by ci/fetch-chromium.sh). A release build restores no
      # caches: a cache written by an earlier run must not influence what is released.
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: Let the pinned Chromium start with its sandbox on
        run: ci/chromium-sandbox.sh
      - name: Browser suites on the pinned Chromium
        run: |
          cargo test -p crawlx-bench --locked -- browser_ --test-threads 1
          cargo test -p crawlx-browser --locked --test cdp_surface
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [authorize, verify]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: write
      id-token: write # keyless signing identity for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Build the source archive and checksums
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')
          mkdir -p dist
          # git archive output depends only on the tagged tree: entries take the commit time,
          # and git's built-in gzip writes no file name or timestamp.
          git archive --format=tar.gz --prefix="crawlx-${version}/" \
            -o "dist/crawlx-${version}-source.tar.gz" "$(git rev-parse HEAD)"
          (cd dist && sha256sum "crawlx-${version}-source.tar.gz" > SHA256SUMS && sha256sum --check SHA256SUMS)
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' dist/RELEASE_NOTES.md; then
            echo "::error title=changelog::empty release notes for ${VERSION}"
            exit 1
          fi
      - name: Generate the CycloneDX SBOM of the tagged tree
        # Lists every locked dependency of the Rust workspace and the test tooling. The scanner
        # image is pinned by digest. SHA256SUMS is rewritten to cover the SBOM as well.
        env:
          SYFT_IMAGE: anchore/syft:v1.20.0@sha256:b46e597614ddc78621e560af3fabf9346e35462ea1c886a38b30bcc7ca601a73
        run: |
          docker run --rm -v "$PWD:/src:ro" "$SYFT_IMAGE" dir:/src \
            --exclude './dist/**' --source-name crawlx --source-version "$VERSION" \
            -o cyclonedx-json > "dist/crawlx-${VERSION}-source.cdx.json"
          python3 -B ci/identity-sbom.py "dist/crawlx-${VERSION}-source.cdx.json" \
            --output "dist/crawlx-${VERSION}-source.identity.cdx.json"
          mv "dist/crawlx-${VERSION}-source.identity.cdx.json" "dist/crawlx-${VERSION}-source.cdx.json"
          (cd dist && sha256sum "crawlx-${VERSION}-source.tar.gz" "crawlx-${VERSION}-source.cdx.json" > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Attest build provenance of the release files
        # Attestations of private repositories need a plan that includes them, so the
        # attestation steps only run once the repository is public. Verify a download with
        # `gh attestation verify <file> --repo <owner>/<repo>`.
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/crawlx-${{ env.VERSION }}-source.tar.gz
            dist/crawlx-${{ env.VERSION }}-source.cdx.json
            dist/SHA256SUMS
      - name: Attest the SBOM against the source archive
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/crawlx-${{ env.VERSION }}-source.tar.gz
          sbom-path: dist/crawlx-${{ env.VERSION }}-source.cdx.json
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/crawlx-${VERSION}-source.tar.gz" "dist/crawlx-${VERSION}-source.cdx.json" dist/SHA256SUMS \
            --verify-tag \
            --draft \
            --title "CrawlX ${VERSION}" \
            --notes-file dist/RELEASE_NOTES.md
