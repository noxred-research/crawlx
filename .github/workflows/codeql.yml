name: codeql

# Static analysis with CodeQL for the Rust workspace, the Node and Python test tooling and the
# workflow files themselves; results go to the repository's code scanning alerts. Code scanning
# "default setup" must stay disabled for this repository, otherwise both setups upload results.
#
# Workflow gate. Only code owners (the `*` rule of .github/CODEOWNERS on the default
# branch) can run this workflow: the first job, `authorize`, checks the actor, the triggering
# actor and, for pull requests, the author and that the head branch is not a fork. The analysis
# job needs it. The privileged fork-PR trigger and `workflow_run` are deliberately not used,
# and the gate refuses any event outside the allow-list below.
#
# This gate is defense in depth. The authoritative controls are repository settings that the
# maintainers apply: fork pull request workflows disabled (or approval required for all
# external contributors), and a branch ruleset that requires code-owner review.
#
# Uploading results to code scanning from a private repository needs a plan that includes it,
# so the analysis only runs once the repository is public.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly (Monday)
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.event.schedule || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Workflow gate (see the header comment). The analysis job depends on this one.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push|pull_request|schedule|workflow_dispatch) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # CODEOWNERS comes from the default branch through the API, never from the checkout
          # of the event under test, so a change to the file cannot authorize itself.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # Users owning the `*` rule (the last `*` line wins, as in GitHub). Team owners
          # (@org/team) cannot be resolved with the workflow token and are ignored.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && github.event.repository.private == false
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
