name: ci

# Workflow gate. Only code owners (the `*` rule of .github/CODEOWNERS on the default
# branch) can run this workflow: the first job, `authorize`, checks the actor, the triggering
# actor and, for pull requests, the author and that the head branch is not a fork. Every other
# job needs it. The privileged fork-PR trigger and `workflow_run` are deliberately not used,
# and the gate refuses any event outside the allow-list below.
#
# This gate is defense in depth. The authoritative controls are repository settings that the
# maintainers apply: fork pull request workflows disabled (or approval required for all
# external contributors), and a branch ruleset that requires code-owner review. A pull request
# runs the workflow file of its own merge commit, so a change to this file is only trusted
# after that review.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly
    - cron: "0 4 * * 0" # weekly (Sunday): chaos-weekly, mutants
  workflow_dispatch:

# Every action is pinned to a commit SHA (supply chain); the comment names the tag the SHA
# was resolved from. dtolnay/rust-toolchain is pinned to a master commit and selects the
# channel through `with.toolchain`.

permissions: {}

# One run per pull request and per scheduled trigger: a new push cancels the superseded
# pull request run, while a started push or scheduled run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.schedule || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # No debug info in CI builds: the workspace has ~300 test binaries and full debug info
  # exhausts the hosted runner disk (linker "Bus error" during the coverage build).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Workflow gate (see the header comment). Every other job depends on this one.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push|pull_request|schedule|workflow_dispatch) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # CODEOWNERS comes from the default branch through the API, never from the checkout
          # of the event under test, so a change to the file cannot authorize itself.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # Users owning the `*` rule (the last `*` line wins, as in GitHub). Team owners
          # (@org/team) cannot be resolved with the workflow token and are ignored.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ci/lint-deps.sh
      - run: ci/lint-bounded.sh
      - run: ci/lint-static.sh
      - run: ci/lint-chromiumoxide.sh
      - run: ci/provenance-check.sh
      - run: ci/shingle-scan.sh --self-test
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories bans sources

  workflow-lint:
    # Static checks of the workflow files themselves: actionlint (syntax, expression types,
    # embedded shell via shellcheck) and zizmor (script injection, excessive permissions,
    # unpinned or impostor actions, credential persistence, cache poisoning). Both tools are
    # pinned: actionlint by release checksum, zizmor by action SHA and exact version.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, sha256-verified)
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSLo "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: actionlint
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          inputs: .github
          advanced-security: false
          annotations: true

  public-hygiene:
    # Public-tree hygiene: no internal-document references, no host paths, no secret shapes.
    # ci/lint-public.sh is a deterministic `git grep` rule set; gitleaks scans the working tree.
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Public-tree lint (built-in and private rules)
        env:
          # Private rules name things that must not appear in this repository, so they live in
          # a repository secret. Without it the job fails instead of passing on built-in rules.
          PUBLIC_LINT_RULES: ${{ secrets.PUBLIC_LINT_RULES }}
          PUBLIC_LINT_REQUIRE_PRIVATE: "1"
        run: ci/lint-public.sh
      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret scan (working tree)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Unit and integration tests with coverage (nextest under cargo-llvm-cov)
        run: cargo llvm-cov nextest --workspace --exclude crawlx-bench --lcov --output-path lcov.info
      - run: cargo nextest run -p crawlx-bench -E 'not test(/browser_/)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: lcov.info

  schema-snapshot:
    # Storage fault drills and the previous-release schema snapshot: the
    # PostgreSQL-terminated T2, every T2 statement failing once (`crawlx-storage` `chaos`
    # failpoints), and all migrations applied on top of `crates/crawlx-storage/schema/v008.sql`.
    # Nightly it also regenerates that snapshot with ci/schema-snapshot.sh (pg_dump of the
    # service's major) and fails if the committed file drifted.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p crawlx-storage --features chaos --test pg_faults -- --nocapture
      - name: Regenerate the v008 snapshot and diff (nightly)
        if: github.event_name == 'schedule'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          ci/schema-snapshot.sh --through 0008 /tmp/v008.sql
          git diff --no-index --exit-code crates/crawlx-storage/schema/v008.sql /tmp/v008.sql

  browser:
    # Pinned Chromium suite: the exact Chrome for Testing archive
    # named in chromium-pin.toml, fetched and sha256-verified by ci/fetch-chromium.sh; the
    # launch pin check runs for real (no CRAWLX_ALLOW_UNPINNED). Runs on every PR touching the
    # browser plane and nightly. Also the CDP-surface probe and the SIGKILL chaos
    # suite, which needs PostgreSQL for the journal the recovery worker reconciles.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - run: cargo test -p crawlx-bench -- browser_ --test-threads 1
      - name: CDP surface against the pinned build
        run: cargo test -p crawlx-browser --test cdp_surface
      - name: Golden trace on the pinned build must be clean
        run: cargo test -p crawlx-bench --test golden_traces -- --nocapture
      - name: "Chaos suite: failpoints, SIGKILL mid-action, recover, reconcile"
        run: |
          cargo test -p crawlx-worker --features chaos --test chaos_failpoints
          cargo test -p crawlx-cli --features chaos --test chaos -- --nocapture

  oracle-actionability:
    # Node oracle: playwright on PRs, both drivers nightly. After the runner's
    # self-test, the AX-recall differential: the Rust test starts the
    # gym, has the driver enumerate G01–G30 (`runner.mjs --discover`), observes the same pages
    # with crawlx on the pinned Chromium and asserts recall >= 0.95 over >= 200 oracle-actionable
    # elements plus per-fixture capability parity. The comparison is uploaded per driver.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'schedule' || contains(github.event.pull_request.title, 'browser'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ github.event_name == 'schedule' && fromJSON('["playwright","patchright"]') || fromJSON('["playwright"]') }}
    env:
      ORACLE_DRIVER: ${{ matrix.driver }}
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: cd bench/browser-oracle && npm ci && npx "$ORACLE_DRIVER" install chromium && npm test
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: AX-recall differential and capability parity (crawlx_bench::oracle::discovery)
        run: cargo test -p crawlx-bench --test oracle_differential -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: oracle-discovery-${{ matrix.driver }}
          path: bench/browser-oracle/out/

  differential-nightly:
    # Firecrawl differential: unmodified pinned self-host in docker,
    # gym fixture crawled through both systems, scored by crawlx-differential. Schedule only:
    # it needs network access for the pinned commit and its images. Optional (continue-on-error)
    # until the divergence ledger is complete. `run.sh all` runs every
    # family of bench/differential/families.json and fails when one misses its expected verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && github.event_name == 'schedule'
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check out the pinned, unmodified upstream for provenance
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: firecrawl/firecrawl
          ref: c31e88c07afe941bfd8aebde61684eeba042abb5
          path: bench/differential/.firecrawl-src
          persist-credentials: false
      - name: Normalized source-shingle provenance gate
        env:
          FIRECRAWL_TREE: bench/differential/.firecrawl-src
        run: ci/shingle-scan.sh
      - run: bench/differential/run.sh all bench/differential/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: differential
          path: bench/differential/out/

  bench-nightly:
    # Criterion regression gate. Nightly only: PR
    # runners are too noisy for a 10% median threshold. The committed baseline in
    # bench/baselines/criterion.json was recorded on the reference runner named inside it;
    # on a different runner the absolute MAIN-target gates (p95) still apply but the relative
    # comparison is trend data, so the job never blocks a merge (continue-on-error).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && github.event_name == 'schedule'
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: ci/bench-gate.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: criterion-nightly
          path: target/criterion/

  fuzz-short:
    # cargo-fuzz smoke: every target 60 s from its committed corpus on
    # PRs, 30 min per target nightly. The targets also build on stable as stdin binaries
    # (`cargo check --manifest-path fuzz/Cargo.toml`), which the lint job does not cover.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 360 || 60 }}
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            fuzz
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz every target
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || '60' }}
        run: |
          cd fuzz
          for target in url_canonicalize param_classify robots_parse sitemap_parse html_extract action_plan_validate scope_pattern_compile ssrf_ip_forms cdp_decode api_request; do
            cargo +nightly fuzz run "$target" "corpus/$target" -- -max_total_time="$SECONDS_PER_TARGET" -max_len=65536
          done
      - name: Minimize corpora (nightly)
        # `cargo fuzz cmin` keeps the committed corpus small; the minimized
        # set is uploaded as an artifact for a follow-up commit, never written back by CI.
        if: github.event_name == 'schedule'
        run: |
          cd fuzz
          for target in url_canonicalize param_classify robots_parse sitemap_parse html_extract action_plan_validate scope_pattern_compile ssrf_ip_forms cdp_decode api_request; do
            cargo +nightly fuzz cmin "$target" "corpus/$target"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'schedule'
        with:
          name: fuzz-corpus-minimized
          path: fuzz/corpus/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  chromium-next:
    # Protocol drift canary: the browser suite and the CDP surface
    # probe against the latest *stable* Chrome for Testing build, not the pin. Nightly and
    # never blocking: a failure here is the early warning that the next pin bump needs work.
    # The golden-trace comparison (crawlx_bench::golden, fixture g03) runs last and its diff is
    # uploaded as the pin-bump review artifact: a pin may move only with a clean diff or with
    # every reported difference resolved.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && github.event_name == 'schedule'
    permissions:
      contents: read
    continue-on-error: true
    env:
      CRAWLX_ALLOW_UNPINNED: "1"
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install the latest stable Chrome for Testing
        run: |
          sudo apt-get update && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 || true
          VERSION=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["channels"]["Stable"]["version"])')
          echo "chromium-next: Stable is $VERSION (pin: $(grep '^version' chromium-pin.toml))"
          curl -fsSLo chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/${VERSION}/linux64/chrome-linux64.zip"
          unzip -q chrome.zip -d "$RUNNER_TEMP"
          echo "CRAWLX_CHROMIUM_PATH=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: CDP surface against Stable
        run: cargo test -p crawlx-browser --test cdp_surface -- --nocapture
      - name: Browser suite against Stable
        run: |
          cargo test -p crawlx-browser --test chromium -- --test-threads 1
          cargo test -p crawlx-bench -- browser_ --test-threads 1
      - name: Golden-trace comparison against Stable (pin-bump review artifact)
        run: cargo test -p crawlx-bench --test golden_traces -- --nocapture
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-next-golden-trace-diff
          path: bench/out/golden-trace-diff.*.json
          if-no-files-found: ignore

  integration:
    # Object-store integration: the S3 artifact backend contract against
    # a MinIO service container (CRAWLX_TEST_S3_ENDPOINT); the same test file also starts MinIO
    # through docker when it can, so both paths run here.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: crawlx
          MINIO_ROOT_PASSWORD: crawlx-secret
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CRAWLX_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CRAWLX_TEST_S3_ACCESS_KEY: crawlx
      CRAWLX_TEST_S3_SECRET_KEY: crawlx-secret
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -p crawlx-storage --test s3 -- --nocapture

  safety-adversarial:
    # Safety kernel on the adversarial fixtures: the safety crate's own
    # suite plus the worker end-to-end `safety_*` tests on the gym, which need real Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - run: cargo test -p crawlx-safety
      - run: cargo test -p crawlx-bench --test worker_e2e safety_ -- --test-threads 1 --nocapture

  chaos-weekly:
    # Full chaos matrix: every `chaos`-feature suite of the
    # workspace on the pinned Chromium and PostgreSQL. Weekly (Sunday cron) and on demand; the
    # per-PR `browser` job keeps the short SIGKILL subset.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'))
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - run: cargo test -p crawlx-storage --features chaos -- --nocapture
      - run: cargo test -p crawlx-worker --features chaos -- --nocapture
      - run: cargo test -p crawlx-cli --features chaos -- --test-threads 1 --nocapture
      # Lease exclusivity at scale: 64 claimers over 100k frontier rows (exclusivity) and
      # 100k session leases reclaimed by the reaper (99.9 % within 120 s).
      - name: Lease exclusivity and reclaim at 64 claimers / 100k rows
        env:
          CRAWLX_LEASE_CLAIMERS: "64"
          CRAWLX_LEASE_ROWS: "100000"
        run: cargo test -p crawlx-storage --test pg -p crawlx-scheduler --test pg_scheduler -- frontier_lease_is_exclusive stale_session_leases --nocapture
      - name: netfault chaos (PostgreSQL resets through the in-process proxy)
        run: cargo test -p crawlx-bench --test netfault -- --nocapture
      - name: Memory-retention sample (needs an otherwise idle host)
        env:
          CRAWLX_SOAK_UNIT: "1"
        run: cargo test -p crawlx-bench --lib soak::tests::chromium_worker_cycles_retain -- --test-threads 1 --nocapture

  rust-latest:
    # Toolchain canary: clippy and the unit suite on the latest stable, ignoring
    # rust-toolchain.toml. Never blocking; a failure is the early warning for the next pin bump.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rust-latest
      - run: rustc --version
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude crawlx-bench

  mutants:
    # Mutation testing: cargo-mutants over the decision crates
    # (`.cargo/mutants.toml`), weekly (Sunday cron) and on demand. `ci/mutants-gate.sh`
    # requires >= 95 % of viable crawlx-safety mutants caught; the other two crates are
    # reported only. Non-blocking (continue-on-error) until the gate has a history.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'))
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install cargo-mutants --locked
      - name: crawlx-safety (gated)
        # cargo-mutants exits 2 when any mutant survives; the gate script decides.
        run: |
          cargo mutants -p crawlx-safety --no-shuffle -j 4 --output mutants-safety || true
          ci/mutants-gate.sh mutants-safety/mutants.out
      - name: crawlx-policy and crawlx-url (reported)
        if: always()
        run: |
          cargo mutants -p crawlx-policy --no-shuffle -j 4 --output mutants-policy || true
          cargo mutants -p crawlx-url --no-shuffle -j 4 --output mutants-url || true
          ci/mutants-gate.sh --report-only mutants-policy/mutants.out
          ci/mutants-gate.sh --report-only mutants-url/mutants.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutants-out
          path: |
            mutants-safety/mutants.out/
            mutants-policy/mutants.out/
            mutants-url/mutants.out/

  gate-g1:
    # Milestone gate G1: the chaos subset, then `g1-report`
    # crawls the D1 set twice per seed on the pinned Chromium and replays the recorded paths,
    # and `gate g1` evaluates the report. `gates/g1.passed` is build-scoped (scope_digest), so
    # it is uploaded as an artifact and never committed. Nightly and on demand.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [authorize, unit, browser]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: Capture completed chaos suites (G1 criterion)
        run: cargo run -p crawlx-bench --bin chaos-report -- --out bench/out/chaos-report.json
      - name: Assemble the G1 report (D1 set, ordered traces, every recorded path)
        run: cargo run -p crawlx-bench --bin g1-report -- --out bench/out/g1-report.json --chaos-report bench/out/chaos-report.json
      - name: Evaluate G1 and authenticate gates/g1.passed
        env:
          CRAWLX_GATE_KEYS: ${{ secrets.CRAWLX_GATE_KEYS }}
          CRAWLX_GATE_KEY_ID: ${{ vars.CRAWLX_GATE_KEY_ID }}
        run: |
          umask 077
          printf '%s\n' "$CRAWLX_GATE_KEYS" > "$RUNNER_TEMP/crawlx-gate-keys"
          export CRAWLX_GATE_KEYS_FILE="$RUNNER_TEMP/crawlx-gate-keys"
          cargo run -p crawlx-bench --bin gate -- g1 --report bench/out/g1-report.json --out gates/g1.passed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-g1
          path: |
            gates/g1.passed
            gates/g1.report.json
            bench/out/chaos-report.json
            bench/out/g1-report.json
          if-no-files-found: warn

  images:
    # Container images: build the API and worker
    # images (the worker image downloads the pinned Chromium archive and verifies its SHA-256
    # against chromium-pin.toml, so a wrong pin fails here), run the container policy test
    # (non-root, no --no-sandbox, pinned build, seccomp profile), generate an SBOM per image
    # with syft and scan with trivy. Critical findings block; the SBOMs and scan reports are
    # uploaded as artifacts. Container publication and image signing (cosign) are not part of
    # the source-tag release workflow (release.yml); no image is pushed for a release.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    env:
      API_IMAGE: crawlx-api:ci
      WORKER_IMAGE: crawlx-worker:ci
      SYFT_IMAGE: anchore/syft:v1.20.0
      TRIVY_IMAGE: aquasec/trivy:0.58.2
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build images
        run: |
          DOCKER_BUILDKIT=1 docker build --pull -f docker/Dockerfile.api -t "$API_IMAGE" .
          DOCKER_BUILDKIT=1 docker build --pull -f docker/Dockerfile.worker -t "$WORKER_IMAGE" .
      - name: Container policy test
        run: ci/container-policy-test.sh "$API_IMAGE" "$WORKER_IMAGE"
      - name: Helm chart renders and the alert rules parse
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine/helm:3.16.3 lint deploy/helm/crawlx
          docker run --rm -v "$PWD:/src" -w /src alpine/helm:3.16.3 template crawlx deploy/helm/crawlx > /dev/null
          docker run --rm -v "$PWD:/src" -w /src --entrypoint promtool prom/prometheus:v3.1.0 check rules deploy/alerts/crawlx-rules.yaml
      - name: SBOM (syft)
        run: |
          mkdir -p sbom
          for img in "$API_IMAGE" "$WORKER_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
              "docker:$img" -o spdx-json > "sbom/${img//[:\/]/_}.spdx.json"
          done
      - name: Vulnerability scan (trivy, CRITICAL blocks)
        run: |
          mkdir -p scan
          for img in "$API_IMAGE" "$WORKER_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan:/out" "$TRIVY_IMAGE" \
              image --severity HIGH,CRITICAL --format json --output "/out/${img//[:\/]/_}.json" "$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --severity CRITICAL --exit-code 1 --ignore-unfixed "$img"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: images-sbom-and-scan
          path: |
            sbom/
            scan/
