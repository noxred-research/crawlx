  chaos-weekly:
    # Full chaos matrix: every `chaos`-feature suite of the
    # workspace on the pinned Chromium and PostgreSQL. Weekly (Sunday cron) and on demand; the
    # per-PR `browser` job keeps the short SIGKILL subset.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: authorize
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'))
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: Chromium sandbox preflight (sandbox stays on; unprivileged user namespaces)
        run: ci/chromium-sandbox.sh
      - run: cargo test -p crawlx-storage --features chaos -- --nocapture
      - run: cargo test -p crawlx-worker --features chaos -- --nocapture
      - run: cargo test -p crawlx-cli --features chaos -- --test-threads 1 --nocapture
      # Lease exclusivity at scale: 64 claimers over 100k frontier rows (exclusivity) and
      # 100k session leases reclaimed by the reaper (99.9 % within 120 s).
      - name: Lease exclusivity and reclaim at 64 claimers / 100k rows
        env:
          CRAWLX_LEASE_CLAIMERS: "64"
          CRAWLX_LEASE_ROWS: "100000"
        run: cargo test -p crawlx-storage --test pg -p crawlx-scheduler --test pg_scheduler -- frontier_lease_is_exclusive stale_session_leases --nocapture
      - name: netfault chaos (PostgreSQL resets through the in-process proxy)
        run: cargo test -p crawlx-bench --test netfault -- --nocapture
      - name: Memory-retention sample (needs an otherwise idle host)
        env:
          CRAWLX_SOAK_UNIT: "1"
        run: cargo test -p crawlx-bench --lib soak::tests::chromium_worker_cycles_retain -- --test-threads 1 --nocapture

  rust-latest:
    # Toolchain canary: clippy and the unit suite on the latest stable, ignoring
    # rust-toolchain.toml. Never blocking; a failure is the early warning for the next pin bump.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Free runner disk space, drop preinstalled browsers
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        # As in `unit`: the runner's Chrome cannot start its sandbox here, so Chromium-gated
        # tests must not discover it; the `browser` job covers them with the pinned build.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: rust-latest
      - run: rustc --version
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit suite on latest stable
        # The trybuild compile-fail cases compare rustc's exact diagnostics, which are pinned to
        # rust-toolchain.toml and change between releases; `unit` runs them on the pinned build.
        run: cargo test --workspace --exclude crawlx-bench -- --skip compile_fail_cases

  mutants:
    # Mutation testing: cargo-mutants over the decision crates
    # (`.cargo/mutants.toml`), weekly (Sunday cron) and on demand. `ci/mutants-gate.sh`
    # requires >= 95 % of viable crawlx-safety mutants caught; the other two crates are
    # reported only. Non-blocking (continue-on-error) until the gate has a history.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'))
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-mutants --locked
      - name: crawlx-safety (gated)
        # cargo-mutants exits 2 when any mutant survives; the gate script decides.
        run: |
          cargo mutants -p crawlx-safety --no-shuffle -j 4 --output mutants-safety || true
          ci/mutants-gate.sh mutants-safety/mutants.out
      - name: crawlx-policy and crawlx-url (reported)
        if: always()
        run: |
          cargo mutants -p crawlx-policy --no-shuffle -j 4 --output mutants-policy || true
          cargo mutants -p crawlx-url --no-shuffle -j 4 --output mutants-url || true
          ci/mutants-gate.sh --report-only mutants-policy/mutants.out
          ci/mutants-gate.sh --report-only mutants-url/mutants.out
      - name: Retain actual safety mutation outcomes for the release checklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-mutants
          path: mutants-safety/mutants.out/outcomes.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-out
          path: |
            mutants-safety/mutants.out/
            mutants-policy/mutants.out/
            mutants-url/mutants.out/

  gate-g1:
    # Milestone gate G1: the chaos subset, then `g1-report`
    # crawls the D1 set twice per seed on the pinned Chromium and replays the recorded paths,
    # and `gate g1` evaluates the report. `gates/g1.passed` is build-scoped (scope_digest), so
    # it is uploaded as an artifact and never committed. Nightly and on demand, on the default
    # branch only: the job holds CRAWLX_GATE_KEYS, so a dispatch on an unreviewed branch (for
    # example a dependency update) must not run it.
    runs-on: ubuntu-latest
    # CRAWLX_GATE_KEYS lives in the `gate-keys` environment, which deploys from `main` only
    # and waits for a code owner's approval, so every run that receives the keys is reviewed.
    environment: gate-keys
    timeout-minutes: 120
    needs: [authorize, unit, browser]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: Chromium sandbox preflight (sandbox stays on; unprivileged user namespaces)
        run: ci/chromium-sandbox.sh
      - name: Capture completed chaos suites (G1 criterion)
        run: cargo run -p crawlx-bench --bin chaos-report -- --out bench/out/chaos-report.json
      - name: Assemble the G1 report (D1 set, ordered traces, every recorded path)
        run: cargo run -p crawlx-bench --bin g1-report -- --out bench/out/g1-report.json --chaos-report bench/out/chaos-report.json
      - name: Evaluate G1 and authenticate gates/g1.passed
        env:
          CRAWLX_GATE_KEYS: ${{ secrets.CRAWLX_GATE_KEYS }}
          CRAWLX_GATE_KEY_ID: ${{ vars.CRAWLX_GATE_KEY_ID }}
        run: |
          umask 077
          printf '%s\n' "$CRAWLX_GATE_KEYS" > "$RUNNER_TEMP/crawlx-gate-keys"
          export CRAWLX_GATE_KEYS_FILE="$RUNNER_TEMP/crawlx-gate-keys"
          cargo run -p crawlx-bench --bin gate -- g1 --report bench/out/g1-report.json --out gates/g1.passed
      - name: Retain actual G1 measurements for the release checklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-g1
          path: bench/out/g1-report.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-g1
          path: |
            gates/g1.passed
            gates/g1.report.json
            bench/out/chaos-report.json
            bench/out/g1-report.json
          if-no-files-found: warn

  images:
    # Container images: build the API and worker
    # images (the worker image downloads the pinned Chromium archive and verifies its SHA-256
    # against chromium-pin.toml, so a wrong pin fails here), run the container policy test
    # (non-root, no --no-sandbox, pinned build, seccomp profile), generate an SBOM per image
    # with syft and scan with trivy. Critical findings block; the SBOMs and scan reports are
    # uploaded as artifacts. Container publication and image signing (cosign) are not part of
    # the source-tag release workflow (release.yml); no image is pushed for a release.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    env:
      API_IMAGE: crawlx-api:ci
      WORKER_IMAGE: crawlx-worker:ci
      SYFT_IMAGE: anchore/syft:v1.20.0
      TRIVY_IMAGE: aquasec/trivy:0.58.2
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          DOCKER_BUILDKIT=1 docker build --pull -f docker/Dockerfile.api -t "$API_IMAGE" .
          DOCKER_BUILDKIT=1 docker build --pull -f docker/Dockerfile.worker -t "$WORKER_IMAGE" .
      - name: Container policy test
        run: ci/container-policy-test.sh "$API_IMAGE" "$WORKER_IMAGE"
      - name: Helm chart renders and the alert rules parse
        run: |
          set -euo pipefail
          helm() { docker run --rm -v "$PWD:/src" -w /src alpine/helm:3.16.3 "$@"; }
          # The chart fails closed without an artifact key provider and a secret-registry Redis,
          # so a render must name both (non-secret test values; the Secrets are never created here).
          custody=(--set artifactCustody.keyFileSecret=crawlx-artifact-key --set artifactCustody.secretRedis.existingSecret=crawlx-secret-registry)
          helm lint deploy/helm/crawlx "${custody[@]}"
          helm template crawlx deploy/helm/crawlx "${custody[@]}" > /dev/null
          # Negative: with no key provider the chart must still refuse to render.
          if refused="$(helm template crawlx deploy/helm/crawlx --set artifactCustody.secretRedis.existingSecret=crawlx-secret-registry 2>&1 > /dev/null)"; then
            echo "chart rendered without an artifact key provider" >&2
            exit 1
          fi
          grep -F 'artifactCustody requires an artifact key provider' <<< "$refused"
          # Negative: with no secret-registry Redis the chart must still refuse to render.
          if refused="$(helm template crawlx deploy/helm/crawlx --set artifactCustody.keyFileSecret=crawlx-artifact-key 2>&1 > /dev/null)"; then
            echo "chart rendered without a secret-registry Redis" >&2
            exit 1
          fi
          grep -F 'artifactCustody.secretRedis.existingSecret is required' <<< "$refused"
          docker run --rm -v "$PWD:/src" -w /src --entrypoint promtool prom/prometheus:v3.1.0 check rules deploy/alerts/crawlx-rules.yaml
          docker run --rm -v "$PWD:/src" -w /src --entrypoint promtool prom/prometheus:v3.1.0 test rules deploy/alerts/crawlx-rules.test.yaml
      - name: SBOM (syft)
        run: |
          mkdir -p sbom
          for img in "$API_IMAGE" "$WORKER_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" \
              "docker:$img" -o spdx-json > "sbom/${img//[:\/]/_}.spdx.json"
            python3 -B ci/identity-sbom.py "sbom/${img//[:\/]/_}.spdx.json" \
              --output "sbom/${img//[:\/]/_}.identity.spdx.json"
            mv "sbom/${img//[:\/]/_}.identity.spdx.json" "sbom/${img//[:\/]/_}.spdx.json"
          done
      - name: Vulnerability scan (trivy, CRITICAL blocks)
        run: |
          mkdir -p scan
          for img in "$API_IMAGE" "$WORKER_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/scan:/out" "$TRIVY_IMAGE" \
              image --severity HIGH,CRITICAL --format json --output "/out/${img//[:\/]/_}.json" "$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
              image --severity CRITICAL --exit-code 1 --ignore-unfixed "$img"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: images-sbom-and-scan
          path: |
            sbom/
            scan/

  # Release-gate checklist consumes only this run's producer artifacts.
  # Dispatch blocks on missing/failing evidence; weekly runs only report. Release tags run
  # release-checklist.yml, which has no producers and no caches.
  release-checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [authorize, unit, browser, gate-g1, mutants]
    if: always() && needs.authorize.outputs.ok == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'))
    permissions:
      contents: read
    continue-on-error: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Download this run's release evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-evidence-*
          path: ${{ runner.temp }}/release-inputs
      - name: Transfer measured inputs and explain missing producers
        if: ${{ !cancelled() }}
        env:
          RELEASE_JOBS: ${{ toJSON(needs) }}
        run: |
          python3 -B ci/release-evidence.py --artifacts "$RUNNER_TEMP/release-inputs"
          cat bench/out/release-evidence.md >> "$GITHUB_STEP_SUMMARY"
      - name: Release-gate checklist
        if: ${{ !cancelled() }}
        run: ci/release-gate.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-checklist
          path: |
            bench/out/release-checklist.json
            bench/out/release-checklist.md
            bench/out/release-evidence.json
            bench/out/release-evidence.md

  # The one check the default-branch ruleset requires. A job skipped by `if:` counts as
  # passed for a required check, so the gated jobs themselves cannot be required: a pull
  # request the gate refuses (a fork, Dependabot, any non-owner) would look green. This job
  # always runs and fails unless the gate admitted the event and every merge-blocking job
  # succeeded, so such a pull request stays unmergeable until an owner runs CI on it.
  required:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - authorize
      - lint
      - workflow-lint
      - public-hygiene
      - unit
      - schema-snapshot
      - browser
      - fuzz-short
      - integration
      - safety-adversarial
      - images
    if: always()
    permissions: {}
    steps:
      - name: Gate admitted the event and every merge-blocking job passed
        env:
          ADMITTED: ${{ needs.authorize.outputs.ok }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$ADMITTED" != true ]; then
            echo "::error title=required::the workflow gate did not admit this event; a code owner must run CI"
            exit 1
          fi
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            while IFS= read -r job; do echo "::error title=required::not passed: $job"; done <<< "$failed"
            exit 1
          fi
          echo "all merge-blocking jobs passed"
