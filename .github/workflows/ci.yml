name: ci

# Workflow gate. Only code owners (the `*` rule of .github/CODEOWNERS on the default
# branch) can run this workflow: the first job, `authorize`, checks the actor, the triggering
# actor and, for pull requests, the author and that the head branch is not a fork. Every other
# job needs it. The privileged fork-PR trigger and `workflow_run` are deliberately not used,
# and the gate refuses any event outside the allow-list below.
#
# This gate is defense in depth. The authoritative controls are repository settings that the
# maintainers apply: fork pull request workflows disabled (or approval required for all
# external contributors), and a branch ruleset that requires code-owner review. A pull request
# runs the workflow file of its own merge commit, so a change to this file is only trusted
# after that review.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly
    - cron: "0 4 * * 0" # weekly (Sunday): chaos-weekly, mutants
  workflow_dispatch:

# Every action is pinned to a commit SHA (supply chain); the comment names the tag the SHA
# was resolved from. dtolnay/rust-toolchain is pinned to a master commit and selects the
# channel through `with.toolchain`.

permissions: {}

# One run per pull request and per scheduled trigger: a new push cancels the superseded
# pull request run, while a started push or scheduled run is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.schedule || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # No debug info in CI builds: the workspace has ~300 test binaries and full debug info
  # exhausts the hosted runner disk (linker "Bus error" during the coverage build).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Workflow gate (see the header comment). Every other job depends on this one.
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.gate.outputs.ok }}
    steps:
      - name: Only code owners' events run workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          deny() {
            echo "::notice title=workflow gate::not run: $1"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT_NAME" in
            push|pull_request|schedule|workflow_dispatch) ;;
            *) deny "event ${EVENT_NAME} is not allowed" ;;
          esac
          # CODEOWNERS comes from the default branch through the API, never from the checkout
          # of the event under test, so a change to the file cannot authorize itself.
          branch="${DEFAULT_BRANCH:-$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)}"
          codeowners=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/CODEOWNERS?ref=${branch}" --jq .content | base64 -d)
          # Users owning the `*` rule (the last `*` line wins, as in GitHub). Team owners
          # (@org/team) cannot be resolved with the workflow token and are ignored.
          owners=$(printf '%s\n' "$codeowners" | awk '
            $1 == "*" {
              o = ""
              for (i = 2; i <= NF; i++) {
                if ($i ~ /^#/) break
                if ($i ~ /^@[A-Za-z0-9-]+$/) o = o tolower(substr($i, 2)) "\n"
              }
            }
            END { printf "%s", o }')
          [ -n "$owners" ] || deny "no user owner for the * rule in CODEOWNERS on ${branch}"
          is_owner() {
            [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF -- "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          }
          is_owner "$ACTOR" || deny "actor is not a code owner"
          is_owner "$TRIGGERING_ACTOR" || deny "triggering actor is not a code owner"
          if [ "$EVENT_NAME" = pull_request ]; then
            is_owner "$PR_AUTHOR" || deny "pull request author is not a code owner"
            [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ] || deny "pull request comes from a fork"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ci/lint-deps.sh
      - run: ci/lint-bounded.sh
      - run: ci/lint-static.sh
      - run: ci/lint-chromiumoxide.sh
      - run: ci/provenance-check.sh
      - name: Sensitive transport boundaries
        run: |
          python3 -B ci/privacy-boundaries.py
          python3 -B -m unittest discover -s ci -p 'test_privacy_boundaries.py'
      - name: Identity provenance and SBOM regressions
        run: python3 -B -m unittest discover -s ci -p 'test_identity_sbom.py'
      - name: Namespace helper regressions
        run: python3 -B -m unittest discover -s deploy/isolation -p 'test_netns_helper.py'
      - run: ci/shingle-scan.sh --self-test
      - name: CI evidence report regressions
        run: python3 -B -m unittest discover -s ci -p 'test_*_reports.py'
      # cargo-deny as a prebuilt, checksum-verified binary (install-action retries downloads);
      # the container-building action failed on a transient release-download error.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses advisories bans sources

  workflow-lint:
    # Static checks of the workflow files themselves: actionlint (syntax, expression types,
    # embedded shell via shellcheck) and zizmor (script injection, excessive permissions,
    # unpinned or impostor actions, credential persistence, cache poisoning). Both tools are
    # pinned: actionlint by release checksum, zizmor by action SHA and exact version.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned release, sha256-verified)
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - run: actionlint
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          inputs: .github
          advanced-security: false
          annotations: true

  public-hygiene:
    # Public-tree hygiene: no internal-document references, no host paths, no secret shapes.
    # ci/lint-public.sh is a deterministic `git grep` rule set; a secret scanner scans the working tree.
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    runs-on: ubuntu-latest
    # PUBLIC_LINT_RULES is an environment secret, not a repository secret: only jobs that
    # name this environment can read it.
    environment: public-lint
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public-tree lint (built-in and private rules)
        env:
          # Private rules name things that must not appear in this repository, so they live in
          # a repository secret. Without it the job fails instead of passing on built-in rules.
          PUBLIC_LINT_RULES: ${{ secrets.PUBLIC_LINT_RULES }}
          PUBLIC_LINT_REQUIRE_PRIVATE: "1"
        run: ci/lint-public.sh
      - name: Install gitleaks (pinned release, sha256-verified)
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Secret scan (working tree)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: authorize
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space, drop preinstalled browsers
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        # Browser tests belong to the `browser` job, which runs the pinned Chromium. Tests
        # that discover a system browser would start the runner's preinstalled Chrome, which
        # cannot create its sandbox here (unprivileged user namespaces are restricted).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Build flake-report
        run: cargo build -q -p crawlx-bench --bin flake-report
      - name: Restore the flake history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/out/flake-history.json
          key: flake-history-${{ github.run_id }}
          restore-keys: flake-history-
      - name: Unit and integration tests with coverage (nextest under cargo-llvm-cov)
        env:
          FLAKE_REPORT: target/debug/flake-report
        run: |
          cargo llvm-cov nextest --profile ci --no-fail-fast --workspace --exclude crawlx-bench \
            -E "$(ci/flake-gate.sh filter)" --lcov --output-path lcov.info
      - name: Keep the unit junit (the coverage build is deleted next)
        if: always()
        run: |
          mkdir -p bench/out
          cp "$(find target -path '*/nextest/ci/junit.xml' | head -n1)" bench/out/junit-unit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Free the coverage build before the bench tests
        # The instrumented build fills most of the hosted runner disk; the bench crate builds
        # in the normal target directory.
        run: |
          cargo llvm-cov clean --workspace
          rm -rf target/llvm-cov-target
          df -h /
      - name: Bench tests (quarantine excluded)
        env:
          FLAKE_REPORT: target/debug/flake-report
        run: cargo nextest run --profile ci --no-fail-fast -p crawlx-bench -E "($(ci/flake-gate.sh filter)) & not test(/browser_/)"
      - name: Record the PR-suite flake history
        if: always()
        env:
          FLAKE_REPORT: target/debug/flake-report
        run: ci/flake-gate.sh record pr bench/out/junit-unit.xml target/nextest/ci/junit.xml
      - name: Save the flake history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench/out/flake-history.json
          key: flake-history-${{ github.run_id }}
      - name: Retain unit flake evidence for the release checklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-unit
          path: bench/out/flake-history.json
          if-no-files-found: warn
      - name: Identity version gates (V2 names; dual-mode version pairs in memory and PostgreSQL)
        run: |
          cargo test -p crawlx-elements -- v2_
          cargo test -p crawlx-worker --test replay_hybrid -- dual_mode

  schema-snapshot:
    # Storage fault drills and the previous-release schema snapshot: the
    # PostgreSQL-terminated T2, every T2 statement failing once (`crawlx-storage` `chaos`
    # failpoints), and all migrations applied on top of `crates/crawlx-storage/schema/v008.sql`.
    # Nightly it also regenerates that snapshot with ci/schema-snapshot.sh (pg_dump of the
    # service's major) and fails if the committed file drifted.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test -p crawlx-storage --features chaos --test pg_faults -- --nocapture
      - name: Regenerate the v008 snapshot and diff (nightly)
        if: github.event_name == 'schedule'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          ci/schema-snapshot.sh --through 0008 /tmp/v008.sql
          git diff --no-index --exit-code crates/crawlx-storage/schema/v008.sql /tmp/v008.sql

  browser:
    # Pinned Chromium suite: the exact Chrome for Testing archive
    # named in chromium-pin.toml, fetched and sha256-verified by ci/fetch-chromium.sh; the
    # launch pin check runs for real (no CRAWLX_ALLOW_UNPINNED). Runs on every PR touching the
    # browser plane and nightly. Also the CDP-surface probe and the SIGKILL chaos
    # suite, which needs PostgreSQL for the journal the recovery worker reconciles.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true'
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crawlx
          POSTGRES_PASSWORD: crawlx
          POSTGRES_DB: crawlx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crawlx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRAWLX_TEST_DATABASE_URL: postgres://crawlx:crawlx@127.0.0.1:5432/crawlx_test
      CRAWLX_TEST_SECRET_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Secret-custody Valkey, persistence-free (same image as docker-compose)
        # A step, not a `services:` container: services cannot pass server arguments.
        run: |
          docker run -d --name secret-custody -p 6390:6379 valkey/valkey:8.1.3-alpine valkey-server --save '' --appendonly no --maxmemory 256mb --maxmemory-policy noeviction
          for _ in $(seq 30); do
            docker exec secret-custody valkey-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          docker logs secret-custody
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/chromium
          key: chromium-${{ hashFiles('chromium-pin.toml') }}
      - name: Chrome for Testing runtime libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - name: Fetch and verify the pinned Chromium (chromium-pin.toml sha256)
        run: echo "CRAWLX_CHROMIUM_PATH=$(ci/fetch-chromium.sh)" >> "$GITHUB_ENV"
      - name: Chromium sandbox preflight (sandbox stays on; unprivileged user namespaces)
        run: ci/chromium-sandbox.sh
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest
      - run: cargo build -q -p crawlx-bench --bin flake-report
      - name: Browser tests and the lane regression (nextest, one rerun to classify)
        env:
          FLAKE_REPORT: target/debug/flake-report
        run: |
          F="$(ci/flake-gate.sh filter)"
          cargo nextest run --profile ci --no-fail-fast -p crawlx-bench -j 1 -E "($F) & (test(/browser_/) | binary(lane_chromium))"
      - name: Record the browser flake history
        if: always()
        env:
          FLAKE_REPORT: target/debug/flake-report
        run: ci/flake-gate.sh record pr target/nextest/ci/junit.xml
      - name: Retain browser flake evidence for the release checklist
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-browser
          path: bench/out/flake-history.json
          if-no-files-found: warn
      - name: CDP surface against the pinned build
        run: cargo test -p crawlx-browser --test cdp_surface
      - name: Golden trace on the pinned build must be clean
        run: cargo test -p crawlx-bench --test golden_traces -- --nocapture
      - name: "Chaos suite: failpoints, SIGKILL mid-action, recover, reconcile"
        run: |
          cargo test -p crawlx-worker --features chaos --test chaos_failpoints
          cargo test -p crawlx-cli --features chaos --test chaos -- --nocapture

  oracle-actionability:
    # Node oracle: the reference driver on PRs, both drivers nightly. After the runner's
    # self-test, the AX-recall differential: the Rust test starts the
    # gym, has the driver enumerate G01–G30 (`runner.mjs --discover`), observes the same pages
    # with crawlx on the pinned Chromium and asserts recall >= 0.95 over >= 200 oracle-actionable
    # elements plus per-fixture capability parity. The comparison is uploaded per driver.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [authorize, unit]
    if: needs.authorize.outputs.ok == 'true' && (github.event_name == 'schedule' || contains(github.event.pull_request.title, 'browser'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        driver: ${{ github.event_name == 'schedule' && fromJSON('["reference","hardened"]') || fromJSON('["reference"]') }}
    env:
      ORACLE_DRIVER: ${{ matrix.driver }}
      ORACLE_PACKAGE: ${{ matrix.driver == 'hardened' && 'patchright' || 'playwright' }} # wire-compat: npm package names behind the driver ids
    steps:
      - name: Free runner disk space
        # Hosted runners ship ~14 GB free; drop preinstalled SDKs this workflow never uses.
        run: |
