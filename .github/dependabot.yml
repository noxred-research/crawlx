# Dependency update pull requests, one weekly batch per ecosystem.
#
# Updates are grouped so a week produces a handful of pull requests rather than dozens, and a
# 7-day cooldown keeps brand-new releases out of the proposals. Security updates are not
# delayed by the cooldown.
#
# Dependabot pull requests never run the CI workflows: their actor and author are the bot, and
# the `authorize` job in every workflow only admits code owners (see .github/CODEOWNERS). The
# required `required` check therefore fails on them. A maintainer handles them as follows:
#   1. Read the diff. For the github-actions ecosystem this includes the new commit SHA, which
#      must also be added to the repository's allowed-actions list or every run fails to start.
#   2. Bring the update onto a branch of your own (merge or cherry-pick it, adapt the code to
#      any breaking change, keep Cargo.lock in step) and open a pull request from that branch.
#      Its CI runs under your identity; `gate-g1`, which holds the gate keys, never runs
#      outside main.
#   3. Merge that pull request once it is green; GitHub then closes the Dependabot one.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # rten moves in lockstep with ocrs (ocrs 0.13 requires rten ^0.26); a lone rten bump
      # cannot build. Remove once a newer ocrs is taken.
      - dependency-name: rten
        update-types: ["version-update:semver-minor"]

  # No separate `/fuzz` entry: the fuzz crate depends on the workspace crates by path, so
  # Dependabot resolved its updates into the root `Cargo.toml` without touching the root
  # `Cargo.lock` (fuzz/Cargo.lock is not committed), leaving the lockfile out of date. The
  # root entry above already covers every crate the fuzz targets build.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /tests/sdk
      - /bench/browser-oracle
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(npm)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tests/sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(pip)"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose-images:
        patterns: ["*"]
    # bitnamilegacy/minio is frozen (no new version tags); Dependabot proposed the floating
    # `2025-debian-12` tag in place of the pinned `2025.7.23`, which CI's service container uses.
    ignore:
      - dependency-name: bitnamilegacy/minio
