# Dependency update pull requests, one weekly batch per ecosystem.
#
# Updates are grouped so a week produces a handful of pull requests rather than dozens, and a
# 7-day cooldown keeps brand-new releases out of the proposals. Security updates are not
# delayed by the cooldown.
#
# Dependabot pull requests never run the CI workflows: their actor and author are the bot, and
# the `authorize` job in every workflow only admits code owners (see .github/CODEOWNERS). A
# maintainer therefore checks them as follows:
#   1. Read the diff. For the github-actions ecosystem this includes the new commit SHA.
#   2. Run CI on the branch under the maintainer's own identity:
#        gh workflow run ci.yml --ref <dependabot branch>
#      Re-running the failed pull request run is not enough: a re-run keeps the original actor.
#   3. Merge once the dispatched run is green.

version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(fuzz)"
    groups:
      fuzz-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /tests/sdk
      - /bench/browser-oracle
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(npm)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tests/sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(pip)"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose-images:
        patterns: ["*"]
