{{- if .Values.artifactCustody.secretRedis.managed.enabled }}
{{- $registry := .Values.artifactCustody.secretRedis }}
{{- $secret := required "artifactCustody.secretRedis.existingSecret is required (keys url and users.acl) when the managed registry is enabled" $registry.existingSecret }}
# Dedicated volatile secret registry. Restart intentionally loses every run's secret
# authority: durable content writes of the affected runs fail closed until the run ends. No PVC,
# RDB, AOF, replicas or backups; keep it separate from the ZDR delivery Redis.
# `users.acl` in the Secret must name the user in the `url` key (the default user for
# redis://:<password>@..., enabled with a password) and grant only what the registry needs on
# `crawlx:secrets:*` keys: data and scripting commands, TIME, INFO and CONFIG GET, never
# SAVE/BGSAVE/CONFIG SET/REPLICAOF/MONITOR, e.g.
#   user default on >PASSWORD ~crawlx:secrets:* &* -@all +@read +@write +@keyspace +@scripting +@connection +time +info +config|get
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-secret-registry
  labels: { app: crawlx-secret-registry, app.kubernetes.io/part-of: crawlx }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: crawlx-secret-registry, release: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: crawlx-secret-registry, release: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "crawlx.podSecurityContext" (dict "uid" 10001) | nindent 8 }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: {{ $registry.managed.image }}
          command: [valkey-server]
          args:
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "yes"
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - {{ $registry.managed.maxmemory | quote }}
            - --maxmemory-policy
            - noeviction
            - --dir
            - /data
            - --aclfile
            - /run/secrets/secret-registry/users.acl
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          securityContext:
            {{- include "crawlx.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml $registry.managed.resources | nindent 12 }}
          volumeMounts:
            - { name: memory, mountPath: /data }
            - { name: credentials, mountPath: /run/secrets/secret-registry, readOnly: true }
      volumes:
        - { name: memory, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - name: credentials
          secret:
            secretName: {{ $secret | quote }}
            items: [{ key: users.acl, path: users.acl }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-secret-registry
  labels: { app: crawlx-secret-registry, app.kubernetes.io/part-of: crawlx }
spec:
  selector: { app: crawlx-secret-registry, release: {{ .Release.Name }} }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
{{- if .Values.networkPolicy.enabled }}
---
# Only crawlx-worker pods reach the registry; the API never does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-secret-registry
spec:
  podSelector:
    matchLabels: { app: crawlx-secret-registry, release: {{ .Release.Name }} }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: crawlx-worker, release: {{ .Release.Name }}, crawlx.dev/egress: allowed } }
      ports: [{ protocol: TCP, port: 6379 }]
  egress: []
{{- end }}
{{- end }}
