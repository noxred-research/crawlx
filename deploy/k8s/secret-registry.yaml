# Dedicated volatile secret registry for artifact custody. No PVC, RDB, AOF, replicas,
# or backups; a restart intentionally loses every run's secret authority, after which durable
# content writes of those runs fail closed until the run ends. Keep it separate from the ZDR
# delivery Redis (zdr-delivery.yaml). Apply this profile only when the cluster has no operator-supplied
# Redis/Valkey that meets the same requirements (persistence off, noeviction, positive maxmemory).
# Create the crawlx-secret-registry Secret keys url and users.acl first (see README.md).
# Only worker pods may connect; the API never does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawlx-secret-registry
  namespace: crawlx
  labels: { app: crawlx-secret-registry }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: crawlx-secret-registry }
  template:
    metadata:
      labels: { app: crawlx-secret-registry }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: valkey/valkey:8.1.3-alpine
          command: [valkey-server]
          args:
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "yes"
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --dir
            - /data
            - --aclfile
            - /run/secrets/secret-registry/users.acl
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: memory, mountPath: /data }
            - { name: credentials, mountPath: /run/secrets/secret-registry, readOnly: true }
      volumes:
        - { name: memory, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - name: credentials
          secret:
            secretName: crawlx-secret-registry
            items: [{ key: users.acl, path: users.acl }]
---
apiVersion: v1
kind: Service
metadata:
  name: crawlx-secret-registry
  namespace: crawlx
spec:
  selector: { app: crawlx-secret-registry }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawlx-secret-registry-ingress
  namespace: crawlx
spec:
  podSelector:
    matchLabels: { app: crawlx-secret-registry }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: crawlx-worker, crawlx.dev/egress: allowed } }
      ports: [{ protocol: TCP, port: 6379 }]
  egress: []
