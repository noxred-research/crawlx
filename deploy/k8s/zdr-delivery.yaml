# Optional multi-node ZDR transport. No PVC, RDB, AOF, replicas, or content backups.
# Create crawlx-zdr Secret keys url and users.acl before applying this profile.
# users.acl must disable default user and grant a dedicated authenticated user CONFIG GET,
# Lua and normal data commands, but deny persistence/config mutation and replication commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawlx-zdr
  namespace: crawlx
  labels: { app: crawlx-zdr }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: crawlx-zdr }
  template:
    metadata:
      labels: { app: crawlx-zdr }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: delivery
          image: valkey/valkey:8.1.3-alpine
          command: [valkey-server]
          args:
            - --bind
            - 0.0.0.0
            - --protected-mode
            - "yes"
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - noeviction
            - --dir
            - /data
            - --aclfile
            - /run/secrets/zdr/users.acl
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 3Gi }
          volumeMounts:
            - { name: memory, mountPath: /data }
            - { name: credentials, mountPath: /run/secrets/zdr, readOnly: true }
      volumes:
        - { name: memory, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - name: credentials
          secret:
            secretName: crawlx-zdr
            items: [{ key: users.acl, path: users.acl }]
---
apiVersion: v1
kind: Service
metadata:
  name: crawlx-zdr
  namespace: crawlx
spec:
  selector: { app: crawlx-zdr }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crawlx-zdr-ingress
  namespace: crawlx
spec:
  podSelector:
    matchLabels: { app: crawlx-zdr }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: crawlx-api } }
        - podSelector: { matchLabels: { app: crawlx-worker, crawlx.dev/egress: allowed } }
      ports: [{ protocol: TCP, port: 6379 }]
  egress: []
