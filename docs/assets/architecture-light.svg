<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="crawlx architecture: clients, API process, worker process with URL plane, Session Actors, safety kernel and egress proxy, PostgreSQL, object store and the web"><title>crawlx architecture</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker></defs><style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}.h{font-size:15px;font-weight:700}.b{font-size:13.5px;font-weight:600}.s{font-size:11.5px;fill:#64748b}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;font-size:11.5px;fill:#64748b}</style><rect width="1120" height="600" rx="16" fill="#ffffff" stroke="#cbd5e1"/><rect x="24" y="60" width="210" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text class="h" x="40" y="86">Clients</text><rect x="44" y="100" width="170" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="129.0" y="123.0" text-anchor="middle">crawlx CLI</text><text class="s" x="129.0" y="140.0" text-anchor="middle">crawl · inspect · replay</text><rect x="44" y="170" width="170" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="129.0" y="193.0" text-anchor="middle">REST + SSE clients</text><text class="s" x="129.0" y="210.0" text-anchor="middle">native API, webhooks</text><rect x="44" y="240" width="170" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="129.0" y="263.0" text-anchor="middle">Firecrawl SDKs</text><text class="s" x="129.0" y="280.0" text-anchor="middle">compat facade · MCP</text><text class="s" x="44" y="326">loopback or your network</text><rect x="270" y="60" width="230" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text class="h" x="286" y="86">API process  (crawlx serve)</text><rect x="290" y="100" width="190" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="385.0" y="123.0" text-anchor="middle">Admission</text><text class="s" x="385.0" y="140.0" text-anchor="middle">scope · profile · authorization</text><rect x="290" y="170" width="190" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="385.0" y="193.0" text-anchor="middle">Auth · idempotency</text><text class="s" x="385.0" y="210.0" text-anchor="middle">scoped keys · tenant RLS</text><rect x="290" y="240" width="190" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="385.0" y="263.0" text-anchor="middle">Facade · SSE · webhooks</text><text class="s" x="385.0" y="280.0" text-anchor="middle">/compat/firecrawl/v2</text><text class="s" x="290" y="320">stateless; hands work to workers</text><text class="s" x="290" y="337">through PostgreSQL leases</text><rect x="540" y="60" width="330" height="470" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text class="h" x="556" y="86">Worker process  (crawlx worker)</text><rect x="560" y="100" width="290" height="46" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="705.0" y="120.0" text-anchor="middle">Lease loop</text><text class="s" x="705.0" y="137.0" text-anchor="middle">fenced leases · checkpoints · reaper</text><rect x="560" y="164" width="138" height="70" rx="9" fill="#ecfeff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="629.0" y="196.0" text-anchor="middle">URL plane</text><text class="s" x="629.0" y="213.0" text-anchor="middle">robots · fetch · extract</text><rect x="712" y="164" width="138" height="70" rx="9" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="781.0" y="196.0" text-anchor="middle">Session Actors</text><text class="s" x="781.0" y="213.0" text-anchor="middle">one writer per browser</text><rect x="560" y="252" width="290" height="56" rx="9" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text class="b" x="705.0" y="277.0" text-anchor="middle">Safety kernel</text><text class="s" x="705.0" y="294.0" text-anchor="middle">classify · adjudicate · confirm · audit</text><rect x="560" y="326" width="138" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="629.0" y="349.0" text-anchor="middle">Egress proxy</text><text class="s" x="629.0" y="366.0" text-anchor="middle">loopback, deny-first</text><rect x="712" y="326" width="138" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="781.0" y="349.0" text-anchor="middle">Chromium</text><text class="s" x="781.0" y="366.0" text-anchor="middle">pinned · CDP · incognito</text><rect x="560" y="396" width="290" height="52" rx="9" fill="#eef2ff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="705.0" y="419.0" text-anchor="middle">Intent journal</text><text class="s" x="705.0" y="436.0" text-anchor="middle">intend → perform → outcome</text><text class="s" x="560" y="478">observe → identify → cluster → propose</text><text class="s" x="560" y="498">strategies advise; only the kernel admits</text><rect x="906" y="60" width="190" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text class="h" x="922" y="86">State</text><rect x="926" y="100" width="150" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="1001.0" y="123.0" text-anchor="middle">PostgreSQL</text><text class="s" x="1001.0" y="140.0" text-anchor="middle">runs · journal · audit</text><rect x="926" y="170" width="150" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="1001.0" y="193.0" text-anchor="middle">Object store</text><text class="s" x="1001.0" y="210.0" text-anchor="middle">sealed artifacts</text><rect x="926" y="240" width="150" height="52" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text class="b" x="1001.0" y="263.0" text-anchor="middle">Valkey / Redis</text><text class="s" x="1001.0" y="280.0" text-anchor="middle">ZDR buffer · secrets</text><text class="s" x="926" y="326">filesystem or S3-compatible</text><rect x="906" y="380" width="190" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><text class="h" x="922" y="406">Optional advice</text><text class="s" x="926" y="428">decision service</text><text class="s" x="926" y="448">ONNX ranker</text><text class="s" x="926" y="468">LLM planner</text><text class="s" x="926" y="500">advisory, never authorizes</text><rect x="270" y="440" width="230" height="90" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text class="h" x="385" y="476" text-anchor="middle">The web</text><text class="s" x="385" y="498" text-anchor="middle">public hosts only; private, link-local</text><text class="s" x="385" y="514" text-anchor="middle">and metadata ranges refused</text><line x1="214" y1="126" x2="270" y2="126" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="214" y1="196" x2="270" y2="196" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="214" y1="266" x2="270" y2="266" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="870" y1="126" x2="906" y2="126" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)" marker-start="url(#ar)"/><line x1="870" y1="196" x2="906" y2="196" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/><line x1="870" y1="266" x2="906" y2="266" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/><line x1="560" y1="352" x2="500" y2="485" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)"/><line x1="870" y1="470" x2="906" y2="450" stroke="#64748b" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 4"/></svg>