<article><h1>Seed Swap Draws a Record Crowd</h1><p>More than four hundred gardeners queued outside the village hall on Saturday morning to trade seed packets and cuttings.</p><p>Organisers ran out of paper envelopes by ten o'clock and began handing out folded newspaper instead.</p></article>
