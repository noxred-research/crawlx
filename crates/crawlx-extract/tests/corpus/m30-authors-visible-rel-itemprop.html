<article><h1>Rooftop Beehives Spread Across the Docks</h1><p class="byline"><a rel="author" href="/people/hanne-ostby">Hanne Ostby</a> and <span itemprop="author">Pavel Roth</span></p><p>Hives on warehouse roofs along the docks now house more than two million bees, the harbour trust reported.</p><p>The honey is sold at the dockside market under a plain white label.</p></article>
