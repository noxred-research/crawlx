<h1>図書館で冬のランタン展が始まる</h1>
<p>市立図書館では土曜日から冬のランタン展が始まった。展示室には地元の子どもたちが作った紙のランタンが二百個ほど並んでいる。</p>
<p>会場の担当者によると、材料は古い新聞紙と竹ひごで、制作には三週間かかった。夜になると館内の照明を落として、ランタンの光だけで本を読むことができる。</p>
<p>展示は二月末まで続く。毎週日曜日には、作り方を教える小さな教室も開かれる予定だ。</p>
