[package]
name = "crawlx-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "crawlx: typed decision engines, calibration, breakers, LLM planner client"

[features]
default = []
# Real ONNX Runtime session and `tokenizers` loader for a model bundle.
# `ort` is built with `load-dynamic`: the runtime shared library is bound at run
# time from `ORT_DYLIB_PATH`; without it `OrtSession::load` reports
# `ModelError::RuntimeUnavailable`.
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies]
crawlx-core = { path = "../crawlx-core" }
blake3.workspace = true
async-trait.workspace = true
ort = { workspace = true, optional = true, features = ["cuda"] }
parking_lot.workspace = true
reqwest.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
wiremock.workspace = true

[[bench]]
name = "decide"
harness = false

[lints]
workspace = true
