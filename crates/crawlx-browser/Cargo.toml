[package]
name = "crawlx-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "crawlx: Chromium lifecycle and the CDP adapter behind BrowserBackend"

[dependencies]
crawlx-core = { path = "../crawlx-core" }
crawlx-policy = { path = "../crawlx-policy" }
crawlx-url = { path = "../crawlx-url" }
crawlx-telemetry = { path = "../crawlx-telemetry" }
async-trait.workspace = true
base64.workspace = true
chromiumoxide.workspace = true
futures.workspace = true
parking_lot.workspace = true
# `install`: Chrome-for-Testing download (streamed, hash-verified) and unpacking
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rustix.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
zip.workspace = true

[dev-dependencies]
crawlx-fetch = { path = "../crawlx-fetch" }
crawlx-observe = { path = "../crawlx-observe" }
chrono.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Controlled loopback HTTP/3 conformance; h3-quinn 0.0.10 targets h3 0.0.8 / Quinn 0.11.
h3 = "=0.0.8"
h3-quinn = "=0.0.10"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
sha1.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints]
workspace = true
