<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>g05 frame one</title>
{{GYM_JS}}
<style>
  body { font: 14px/1.3 system-ui, sans-serif; margin: 8px; background: #f6f6fa; }
  iframe { display: block; width: 95%; height: 260px; border: 2px solid #6a6; margin: 8px 0; }
  button { margin: 4px; }
</style>
</head>
<body>
<p>Frame one (same-origin document, lineage main/f1)</p>
<button id="f1-1" type="button">Save</button>
<button id="f1-2" type="button">Cancel</button>
<button id="f1-3" type="button">Open</button>
<button id="f1-4" type="button">Edit</button>
<button id="f1-5" type="button">Delete</button>
<iframe id="f1a" name="f1a" title="Frame one A"></iframe>
<script>
(function () {
  for (var i = 1; i <= 5; i++) {
    (function (id) {
      document.getElementById(id).addEventListener('click', function (ev) { __gym.hit(id, ev); });
    })('f1-' + i);
  }
  // f1a is a srcdoc frame (depth 2); it embeds f1b, another srcdoc frame (depth 3).
  var build = window.top && window.top.__g05srcdoc;
  if (build) {
    document.getElementById('f1a').srcdoc = build('f1a', 'Frame one A (srcdoc, depth 2)', ['f1b', 'Frame one B (srcdoc, depth 3)']);
  }
})();
</script>
</body>
</html>
