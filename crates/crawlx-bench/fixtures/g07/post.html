<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>g07 post</title>
{{GYM_JS}}
</head>
<body>
<h1 id="title">Post</h1>
<p id="body"></p>
<a id="post-back" href="/g07/">Back to the feed</a>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id') || '1';
  document.getElementById('title').textContent = 'Post #' + id;
  document.getElementById('body').textContent = 'Full text of post ' + id + '.';
  document.getElementById('post-back').addEventListener('click', function (ev) { __gym.hit('post-back', ev); });
})();
</script>
</body>
</html>
