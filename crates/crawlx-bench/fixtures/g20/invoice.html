<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>g20 invoice</title>
{{GYM_JS}}
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 24px; }
  button { margin: 4px; }
  #comments { list-style: none; padding: 0; }
  #comments li { border-left: 3px solid #889; padding: 4px 8px; margin: 4px 0; }
</style>
</head>
<body>
<h1 id="title">Invoice</h1>
<p id="meta" aria-live="polite"></p>
<ul id="comments" aria-label="Comments"></ul>
<button id="inv-paid" type="button">Mark paid</button>
<button id="inv-comment" type="button">Reply</button>
<button id="inv-delete" type="button">Delete invoice</button>
<p><a id="inv-back" href="/g20/">Back to invoices</a></p>
<script>
(function () {
  function $(id) { return document.getElementById(id); }
  var id = new URLSearchParams(location.search).get('id') || '1';
  function load() {
    return __gym.api('GET', 'invoices/' + id).then(function (r) {
      if (!r.ok) { $('title').textContent = 'Invoice ' + id; $('meta').textContent = 'Not visible to you (' + (r.context || 'anonymous') + ')'; return; }
      var inv = r.invoice;
      $('title').textContent = inv.title;
      $('meta').textContent = 'Owner ' + inv.owner + ', ' + inv.visibility + ', ' + inv.status + ' (you: ' + r.context + ')';
      var ul = $('comments');
      ul.textContent = '';
      inv.comments.forEach(function (c) {
        var li = document.createElement('li');
        li.textContent = c.by + ': ' + c.text;
        ul.appendChild(li);
      });
    });
  }
  $('inv-paid').addEventListener('click', function (ev) {
    __gym.hit('inv-paid', ev);
    __gym.api('PUT', 'invoices/' + id, { status: 'paid' }).then(load);
  });
  $('inv-comment').addEventListener('click', function (ev) {
    __gym.hit('inv-comment', ev);
    __gym.api('POST', 'invoices/' + id + '/comments', { text: 'Reply on invoice ' + id }).then(load);
  });
  $('inv-delete').addEventListener('click', function (ev) {
    __gym.hit('inv-delete', ev);
    __gym.api('DELETE', 'invoices/' + id).then(load);
  });
  $('inv-back').addEventListener('click', function (ev) { __gym.hit('inv-back', ev); });
  load();
})();
</script>
</body>
</html>
