# Packaging input for 0004-bundled-hunspell-dictionaries.patch.
# This is an explicit package step, not a GN argument or a download manifest.
# Run after staging the Linux chrome executable and before archiving its directory.
# CHROMIUM_PACKAGE_ROOT must be the directory containing that executable (DIR_ASSETS).
# No regeneration, renaming, network access, or substitution of dictionary bytes.
schema_version = 1
chromium_version = "155.0.8059.84"
chromium_revision = "5869fe313571d75152b77813cf0a4ee26a4e6df0"
repository = "https://chromium.googlesource.com/chromium/deps/hunspell_dictionaries.git"
revision = "cee14e319bb7603a1157bb4d1e216be64ee82b77"
source_base = "https://chromium.googlesource.com/chromium/deps/hunspell_dictionaries/+/cee14e319bb7603a1157bb4d1e216be64ee82b77/"
source_directory = "third_party/hunspell_dictionaries"
destination_directory = "Dictionaries"
languages = ["en-US"]
other_languages = "Not disabled or remapped; existing user dictionaries and explicit download/retry behavior remain unchanged."

[license]
english_notice = "README_en_US.txt"
english_terms = "SCOWL/VarCon permission notices, public-domain sources, WordNet notice, and modified Ispell BSD terms; retain the complete notice."
chromium_additions = "README.chromium records en_US delta additions under the existing GPL/LGPL/MPL tri-license in COPYING; preserve COPYING and LICENSE plus the corresponding source inputs."
redistribution = "Ship all files below verbatim. NOTICE explicitly marks this Chromium-derived dictionary as modified. No endorsement rights are granted."

[[input]]
path = "en-US-10-2.bdic"
size = 451982
sha256 = "b0d80e6b6c5491879365e176ecbd98074602a663429bcfcfb0a5a8375c051f13"

[[input]]
path = "README.chromium"
sha256 = "9a461fec92db85f1388e4334b6744d0582e0d9f220fbdf8babfe772bd21d790c"

[[input]]
path = "README_en_US.txt"
sha256 = "168b4c01cb841f766a72f310b065c04d09cff46376c37a81d799593ce751c371"

[[input]]
path = "LICENSE"
sha256 = "d63c6240d6f6330a025aade63d317d7ff04f95fc3325fe6aea3848ca452f64ea"

[[input]]
path = "COPYING"
sha256 = "cde91164e09e33e94e1db4529aa77f89bc0c392b1ed138d689c66dfbd11d9701"

[[input]]
path = "en_US.aff"
sha256 = "c7a8c4d08c29d237880844b1623099f59092602f189be38ce3912e457ff38bc1"

[[input]]
path = "en_US.dic"
sha256 = "f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647"

[[input]]
