sha256 = "3c7f0ecc1689998583fb0905f59b1acf231ae8c2e31951b1a5dc3bc2341ea1c6"

[package]
# Parent can run this exact command from the crawlx checkout (Python >= 3.11):
# CHROMIUM_SRC=$HOME/.cache/crawlx/chromium-build/src CHROMIUM_PACKAGE_ROOT=/path/to/staged/chrome-directory python3 -c 'import subprocess,tomllib; c=tomllib.load(open("ci/chromium-dictionaries.toml","rb")); subprocess.run(["bash","-euc",c["package"]["install_command"]],check=True)'
install_command = '''
set -eu
: "${CHROMIUM_SRC:?set CHROMIUM_SRC to the exact Chromium checkout}"
: "${CHROMIUM_PACKAGE_ROOT:?set CHROMIUM_PACKAGE_ROOT to the directory containing staged chrome}"
test -f "$CHROMIUM_PACKAGE_ROOT/chrome"
source_dir="$CHROMIUM_SRC/third_party/hunspell_dictionaries"
test "$(git -C "$source_dir" rev-parse HEAD)" = cee14e319bb7603a1157bb4d1e216be64ee82b77
(
  cd "$source_dir"
  sha256sum -c <<'CHECKSUMS'
b0d80e6b6c5491879365e176ecbd98074602a663429bcfcfb0a5a8375c051f13  en-US-10-2.bdic
9a461fec92db85f1388e4334b6744d0582e0d9f220fbdf8babfe772bd21d790c  README.chromium
168b4c01cb841f766a72f310b065c04d09cff46376c37a81d799593ce751c371  README_en_US.txt
d63c6240d6f6330a025aade63d317d7ff04f95fc3325fe6aea3848ca452f64ea  LICENSE
cde91164e09e33e94e1db4529aa77f89bc0c392b1ed138d689c66dfbd11d9701  COPYING
c7a8c4d08c29d237880844b1623099f59092602f189be38ce3912e457ff38bc1  en_US.aff
f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647  en_US.dic
3c7f0ecc1689998583fb0905f59b1acf231ae8c2e31951b1a5dc3bc2341ea1c6  en_US.dic_delta
CHECKSUMS
)
install -d -m 0755 "$CHROMIUM_PACKAGE_ROOT/Dictionaries"
for name in en-US-10-2.bdic README.chromium README_en_US.txt LICENSE COPYING en_US.aff en_US.dic en_US.dic_delta; do
  install -m 0444 "$source_dir/$name" "$CHROMIUM_PACKAGE_ROOT/Dictionaries/$name"
done
printf '%s\n' \
  'Chromium-derived modified en_US dictionary, shipped verbatim from:' \
  'https://chromium.googlesource.com/chromium/deps/hunspell_dictionaries/+/cee14e319bb7603a1157bb4d1e216be64ee82b77/' \
  'English base: SCOWL 2020.12.07; Chromium adds en_US.dic_delta words.' \
  'Complete copyright, permission, disclaimer and license texts accompany this file.' \
  > "$CHROMIUM_PACKAGE_ROOT/Dictionaries/NOTICE"
chmod 0444 "$CHROMIUM_PACKAGE_ROOT/Dictionaries/NOTICE"
'''
